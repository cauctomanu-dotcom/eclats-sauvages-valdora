name: Apply Valdora V121 creator NPC cycle fix

on:
  push:
    paths:
      - '.github/workflows/apply-v121-creator-npc-cycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V121 patch
        run: python tools/apply_v121_creator_npc_cycle.py

      - name: Verify V121 invariants
        run: |
          set -euo pipefail
          node --check game/VALDORA_LIVING_WORLD_V118.js
          node --check game/VALDORA_CREATOR_GATE_V121.js
          grep -q "V121-CYCLE-ROUTES" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "cycleOnlyV121:true" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "v121_roamer_" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "VALDORA_CREATOR_GATE_V121.js?v=121-creator-1" game/index.html
          grep -q "valdoraCreatorAuthV121" game/CREATEUR.html
          grep -q "2071eacbcc461240288799233872f9c15e7714f58be2a9ad413f399986b75eea" game/VALDORA_CREATOR_GATE_V121.js
          ! grep -q "VALDORA-5ZWE-2JWB-EMPM" game/VALDORA_CREATOR_GATE_V121.js
          ! grep -q "CYCLE_TOWNS_V119" game/VALDORA_LIVING_WORLD_V118.js
          ! grep -q "ctx.strokeStyle='rgba(31,126,96" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "const VERSION = 'v121-pwa-1';" game/sw.js
          git diff --check

      - name: Commit V121 source changes
        run: |
          set -euo pipefail
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add game/VALDORA_LIVING_WORLD_V118.js game/VALDORA_CREATOR_GATE_V121.js game/index.html game/CREATEUR.html game/sw.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m "fix: restore creator access persistent NPCs and bike-only routes"
          git push origin HEAD:main
