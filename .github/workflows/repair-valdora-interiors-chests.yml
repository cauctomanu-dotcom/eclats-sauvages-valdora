name: Repair Valdora interiors and chests

on:
  push:
    paths:
      - '.github/workflows/repair-valdora-interiors-chests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard route chest rendering
        shell: python
        run: |
          from pathlib import Path
          p=Path('game/index.html')
          s=p.read_text(encoding='utf-8')
          old="else if(sc.kind==='route'){for(const o of routeObjects(sc,state.zone))drawObject(o,camX,camY,sx,sy)}"
          new="else if(sc.kind==='route'){for(const o of routeObjects(sc,state.zone))if(o.type!=='chest'||!window.ValdoraChestV118Bridge?.ownedByV118)drawObject(o,camX,camY,sx,sy)}"
          if old in s:s=s.replace(old,new,1)
          if new not in s:raise SystemExit('Route chest guard missing')
          p.write_text(s,encoding='utf-8')
      - name: Verify final repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Date.now()+15000" game/index.html
          grep -q "},15000)" game/index.html
          grep -q "window.ValdoraChestV118Bridge=" game/index.html
          grep -q "reservedLooks" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "ValdoraChestV118Bridge?.ownedByV118" game/index.html
          node --check game/VALDORA_LIVING_WORLD_V118.js
          git diff --check
      - name: Commit final guard
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- game/index.html; then exit 0; fi
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add game/index.html
          git commit -m "fix: prevent duplicate route chest rendering"
          git push origin HEAD:main
