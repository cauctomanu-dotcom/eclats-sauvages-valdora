name: Fix V121 creator digest cache
on:
  push:
    paths:
      - '.github/workflows/fix-creator-digest-cache-v121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply creator digest and cache fix
        run: python tools/fix_creator_digest_cache_v121.py
      - name: Verify
        run: |
          set -euo pipefail
          node --check game/VALDORA_CREATOR_GATE_V121.js
          grep -q "00c4e4e30b58c4f17d24467eabef210d3ebd6cb67f0bb0c348f79c1c8d804931" game/VALDORA_CREATOR_GATE_V121.js
          grep -q "2177026350,2456956037" game/VALDORA_CREATOR_GATE_V121.js
          ! grep -q "VALDORA-5ZWE-2JWB-EMPM" game/VALDORA_CREATOR_GATE_V121.js
          grep -q "121-creator-2" game/index.html
          grep -q "v121-pwa-2" game/sw.js
          git diff --check
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add game/VALDORA_CREATOR_GATE_V121.js game/index.html game/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize creator password and refresh PWA cache"
          git push origin HEAD:main
