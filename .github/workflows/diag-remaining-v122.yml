name: Diagnose remaining V122 issues
on:
  push:
    paths:
      - '.github/workflows/diag-remaining-v122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract remaining code paths
        run: python tools/diag_remaining_v122.py
      - name: Commit diagnostic reports
        run: |
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add _AI_V122_remaining_*.txt
          git commit -m "chore: add split remaining V122 diagnostics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
