name: Normalize Valdora V120 world charter

on:
  push:
    paths:
      - '.github/workflows/normalize-v120-world-charter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V120 charter patch
        run: python tools/apply_v120_charter.py

      - name: Verify V120 charter rules
        run: |
          set -euo pipefail
          grep -q "SINGLETON_BUILDINGS_V120" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "normalizeTownBuildingsV120" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "sc?.townNPCs" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "distance(n,state)<=94" game/VALDORA_LIVING_WORLD_V118.js
          ! grep -q "b.w=Math.round(b.w\*.82)" game/VALDORA_LIVING_WORLD_V118.js
          ! grep -q "b.w=Math.round(b.w\*.64)" game/VALDORA_LIVING_WORLD_V118.js
          node --check game/VALDORA_LIVING_WORLD_V118.js
          git diff --check

      - name: Commit V120 world charter
        run: |
          set -euo pipefail
          if git diff --quiet -- game/VALDORA_LIVING_WORLD_V118.js; then
            echo 'No source changes needed'
            exit 0
          fi
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add game/VALDORA_LIVING_WORLD_V118.js
          git commit -m "fix: normalize building scale services and NPC interactions"
          git push origin HEAD:main
