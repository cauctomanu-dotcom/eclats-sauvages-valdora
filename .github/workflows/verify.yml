name: Vérifier le dépôt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Vérifier les fichiers et chemins du jeu
        run: python outils/verifier_depot.py

      - name: Vérifier la syntaxe JavaScript
        run: node outils/verifier_javascript.mjs
