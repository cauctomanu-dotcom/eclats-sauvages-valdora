name: Diagnose Valdora bicycle systems

on:
  push:
    paths:
      - '.github/workflows/diag-bike-v119.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture bicycle references
        shell: bash
        run: |
          set -e
          {
            echo '=== BIKE REFERENCES ==='
            grep -RniE "state\.bike|bike|bicyclette|vélo|velo" game --include='*.js' --include='*.html' | head -n 400 || true
            echo '=== SCENE PATH REFERENCES ==='
            grep -RniE "v104Path|v76Path|v105dRoad" game/V109W_CORRECTIFS_GAMEPLAY.js game/VALDORA_LIVING_WORLD_V118.js game/index.html | head -n 220 || true
          } > .github/diag-bike-v119.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add .github/diag-bike-v119.txt
          git commit -m "chore: capture bicycle diagnostics" || exit 0
          git push origin HEAD:main
