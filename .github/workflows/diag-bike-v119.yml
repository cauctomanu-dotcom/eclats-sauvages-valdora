name: Repair Valdora interactions and cycle network

on:
  push:
    paths:
      - '.github/workflows/diag-bike-v119.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch targeting and bicycle rules
        shell: python
        run: |
          from pathlib import Path

          index_path=Path('game/index.html')
          interior_path=Path('game/V109V_INTERIEUR_REWRITE.js')
          living_path=Path('game/VALDORA_LIVING_WORLD_V118.js')
          index=index_path.read_text(encoding='utf-8')
          interior=interior_path.read_text(encoding='utf-8')
          living=living_path.read_text(encoding='utf-8')

          def block_end(text, open_brace):
              depth=0; quote=None; escape=False; template=False; i=open_brace
              while i<len(text):
                  ch=text[i]
                  if escape:
                      escape=False; i+=1; continue
                  if quote:
                      if ch=='\\': escape=True
                      elif ch==quote: quote=None
                      i+=1; continue
                  if ch in ('"',"'"):
                      quote=ch; i+=1; continue
                  if ch=='`':
                      template=not template; i+=1; continue
                  if template:
                      i+=1; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:return i+1
                  i+=1
              raise SystemExit('Unbalanced block')

          def function_span(text, anchor):
              start=text.find(anchor)
              if start<0: raise SystemExit('Missing anchor: '+anchor)
              brace=text.find('{',start+len(anchor))
              if brace<0: raise SystemExit('Missing opening brace: '+anchor)
              return start,brace,block_end(text,brace)

          def replace_function(text, anchor, replacement):
              start,brace,end=function_span(text,anchor)
              return text[:start]+replacement+text[end:]

          # ------------------------------------------------------------
          # 1. Interior E/Enter targeting: facing + short reach.
          # ------------------------------------------------------------
          start=interior.find('function nearestNpcWithDistance()')
          end=interior.find('function prompt()',start)
          if start<0 or end<0: raise SystemExit('Interior targeting block not found')
          target_block=r'''function facingVector(){
            const d=((Number(state.dir)||0)%4+4)%4;
            return d===1?{x:-1,y:0}:d===2?{x:1,y:0}:d===3?{x:0,y:-1}:{x:0,y:1}
          }
          function targetMetrics(x,y,maxDistance){
            const dx=Number(x)-Number(state.roomX),dy=Number(y)-Number(state.roomY),dist=Math.hypot(dx,dy);
            if(!Number.isFinite(dist)||dist>maxDistance)return null;
            if(dist<1)return{distance:0,forward:0,side:0,score:0};
            const f=facingVector(),forward=dx*f.x+dy*f.y,side=Math.abs(dx*f.y-dy*f.x);
            if(dist>24&&(forward<3||side>Math.max(42,forward*.82+18)))return null;
            return{distance:dist,forward,side,score:dist+side*.58-Math.max(0,forward)*.08}
          }
          function furnitureAimPoint(m){
            const r=rectOf(m),px=Number(state.roomX),py=Number(state.roomY),x=Math.max(r.x,Math.min(r.x+r.w,px)),y=Math.max(r.y,Math.min(r.y+r.h,py));
            if(Math.hypot(x-px,y-py)>1)return{x,y};
            return{x:r.x+r.w/2,y:r.y+r.h/2}
          }
          function nearestNpcWithDistance(){
            let best=null,bm=null;for(const n of session?.npcs||[]){const m=targetMetrics(n.x,n.y,84);if(!m)continue;if(!bm||m.score<bm.score){best=n;bm=m}}
            return{target:best,distance:bm?.distance??Infinity,score:bm?.score??Infinity,metrics:bm}
          }
          function nearestFurnitureWithDistance(max=96){
            let best=null,bm=null;for(const m of furn()){
              if(!userInteractable(m))continue;const d=pointRectDistance(state.roomX,state.roomY,rectOf(m));if(d>max)continue;
              const p=furnitureAimPoint(m),metrics=targetMetrics(p.x,p.y,max+8);if(!metrics)continue;
              const fn=String(m.fonction||'decor'),functional=fn!=='decor'&&fn!=='collision_mur',score=metrics.score+(functional?-4:7);
              if(!bm||score<bm.score){best=m;bm={...metrics,score}}
            }
            return{target:best,distance:bm?.distance??Infinity,score:bm?.score??Infinity,metrics:bm}
          }
          function nearNpc(){const q=nearestNpcWithDistance();return q.target||null}
          function nearFurniture(max=96){return nearestFurnitureWithDistance(max).target}
          function nearestInteractionTarget(){
            const nq=nearestNpcWithDistance(),fq=nearestFurnitureWithDistance(96),n=nq.target,m=fq.target;
            if(n&&m)return fq.score<=nq.score+6?{kind:'furniture',target:m,score:fq.score}:{kind:'npc',target:n,score:nq.score};
            if(m)return{kind:'furniture',target:m,score:fq.score};if(n)return{kind:'npc',target:n,score:nq.score};return null
          }
          '''
          interior=interior[:start]+target_block+interior[end:]

          old_api="const api={version:VERSION,enter,leave,move:moveInteriorNew,draw,interact,interactFurniture,nearFurniture,nearNpc,nearDoor,blocked,moveToRoom,destinations,session:()=>session,rawRoom,furniture:furn,audit};"
          new_api="const api={version:VERSION,enter,leave,move:moveInteriorNew,draw,interact,interactFurniture,nearFurniture,nearNpc,nearDoor,blocked,moveToRoom,destinations,session:()=>session,rawRoom,furniture:furn,interactionTarget:nearestInteractionTarget,audit};"
          if old_api not in interior: raise SystemExit('V109V API anchor not found')
          interior=interior.replace(old_api,new_api,1)

          # V118 residents use the SAME selected target as V109V. Furniture no longer
          # loses to a random nearby resident before the base engine gets a chance.
          interact_interior=r'''function interactInteriorV118(){
            ensureInteriorPopulation(true);
            const q=BASE.interior?.interactionTarget?.();
            if(q?.kind==='npc'&&q.target?.v118Resident){
              const n=q.target;faceInterior(n);const s=interiorSession(),zone=s?.zone||state.zone,name=n.name||'Habitant';
              if(typeof dialog==='function')dialog(`<b>${name}</b><br>${talkLine(n,zone,s?.key||'intérieur')}`);return true
            }
            return typeof BASE.interactInterior==='function'?BASE.interactInterior.apply(this,arguments):false
          }'''
          living=replace_function(living,'function interactInteriorV118()',interact_interior)

          # ------------------------------------------------------------
          # 2. Bicycle progression: 4 seals unlock it, never auto-mount.
          # ------------------------------------------------------------
          old_unlock='if(state.seals.length>=4)state.bike=true;'
          new_unlock="if(state.seals.length>=4){state.flags=state.flags||{};state.flags.v119BikeUnlocked=true;}"
          if old_unlock not in index: raise SystemExit('Legacy bike auto-enable not found')
          index=index.replace(old_unlock,new_unlock,1)

          cycle_marker='const CYCLE_TOWNS_V119='
          if cycle_marker not in living:
              insert_at=living.find('function stateV118(){')
              if insert_at<0: raise SystemExit('V118 insertion point not found')
              cycle_code=r'''// ---------------------------------------------------------------------
          // V119 — Réseau cyclable. La bicyclette est débloquée après 4 Sceaux,
          // mais n'est utilisable que sur les pistes explicitement matérialisées.
          // ---------------------------------------------------------------------
          const CYCLE_TOWNS_V119=new Set(['town0','town2','town4','town6','town9','town10','town13']);
          const CYCLE_ROUTES_V119=new Set(['route0','route2','route3','route4','route6','route8','route10','route12']);
          let bikeNoticeAtV119=0;
          function bikeUnlockedV119(){return creator()||!!state?.flags?.v119BikeUnlocked||(Array.isArray(state?.seals)&&state.seals.length>=4)}
          function ensureBikeUnlockV119(){
            state.flags=state.flags||{};
            if(Array.isArray(state.seals)&&state.seals.length>=4&&!state.flags.v119BikeUnlocked){
              state.flags.v119BikeUnlocked=true;state.bike=false;
              if(!state.flags.v119BikeUnlockNotified){state.flags.v119BikeUnlockNotified=true;try{toast?.('Bicyclette débloquée ! Elle s’utilise uniquement sur les pistes cyclables.')}catch(_){} }
              try{save?.(false)}catch(_){}
            }
            if(!bikeUnlockedV119()&&state.bike)state.bike=false;
            return bikeUnlockedV119()
          }
          function cycleRoutePathV119(sc,zone){
            if(!CYCLE_ROUTES_V119.has(zone)||sc?.kind!=='route'||sc?.v116Sanctuary)return[];
            const p=Array.isArray(sc.v104Path)&&sc.v104Path.length?sc.v104Path:Array.isArray(sc.v76Path)&&sc.v76Path.length?sc.v76Path:Array.isArray(sc.kPath)?sc.kPath:[];
            return p.map(q=>Array.isArray(q)?{x:Number(q[0]),y:Number(q[1])}:{x:Number(q?.x),y:Number(q?.y)}).filter(q=>Number.isFinite(q.x)&&Number.isFinite(q.y))
          }
          function cycleSegmentsV119(sc=current(),zone=state?.zone){
            if(!sc)return[];const out=[];
            if(CYCLE_ROUTES_V119.has(zone)){
              const p=cycleRoutePathV119(sc,zone);for(let i=0;i<p.length-1;i++)out.push([p[i],p[i+1]]);return out
            }
            if(CYCLE_TOWNS_V119.has(zone)&&sc.kind==='town'){
              const g=roadNodes(sc);for(const n of g.list||[])for(const k of n.neighbors||[]){const o=g.map.get(k);if(o&&String(n.key)<String(o.key))out.push([{x:n.x,y:n.y},{x:o.x,y:o.y}])}
            }
            return out
          }
          function pointSegmentDistanceV119(px,py,a,b){
            const vx=b.x-a.x,vy=b.y-a.y,wx=px-a.x,wy=py-a.y,l2=vx*vx+vy*vy;if(l2<1)return Math.hypot(wx,wy);
            const t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/l2)),x=a.x+t*vx,y=a.y+t*vy;return Math.hypot(px-x,py-y)
          }
          function onCycleTrackV119(zone=state?.zone,x=state?.x,y=state?.y){
            const sc=sceneFor(zone);if(!sc||typeof scene!=='undefined'&&scene!=='world')return false;
            const px=Number(x),py=Number(y);if(!Number.isFinite(px)||!Number.isFinite(py))return false;
            return cycleSegmentsV119(sc,zone).some(([a,b])=>pointSegmentDistanceV119(px,py,a,b)<=62)
          }
          function cycleCameraV119(sc){
            const vw=1600,vh=1000,w=Number(sc?.width)||vw,h=Number(sc?.height)||vh;
            const maxX=Math.max(0,w-vw),maxY=Math.max(0,h-vh),camX=Math.max(0,Math.min(maxX,Number(state?.x||0)-vw/2)),camY=Math.max(0,Math.min(maxY,Number(state?.y||0)-vh/2));
            return{camX,camY,sx:960/vw,sy:600/vh}
          }
          function drawCycleTracksV119(){
            if(typeof scene==='undefined'||scene!=='world')return;const sc=current(),segments=cycleSegmentsV119(sc,state?.zone);if(!segments.length)return;
            const c=cycleCameraV119(sc);ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=.82;
            for(const [a,b] of segments){const x1=(a.x-c.camX)*c.sx,y1=(a.y-c.camY)*c.sy,x2=(b.x-c.camX)*c.sx,y2=(b.y-c.camY)*c.sy;if(Math.max(x1,x2)<-40||Math.min(x1,x2)>1000||Math.max(y1,y2)<-40||Math.min(y1,y2)>640)continue;ctx.strokeStyle='#2f8d73';ctx.lineWidth=10;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle='rgba(240,255,249,.92)';ctx.lineWidth=2;ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
            ctx.setLineDash([]);ctx.restore()
          }
          function bikeNoticeV119(msg){const now=Date.now();if(now-bikeNoticeAtV119<1300)return;bikeNoticeAtV119=now;try{toast?.(msg)}catch(_){}}
          function refreshBikeUiV119(){
            ensureBikeUnlockV119();if(typeof scene!=='undefined'&&scene!=='world'&&state.bike)state.bike=false;
            let panel=document.getElementById('v119CyclePanel'),btn=document.getElementById('v119BikeBtn');
            if(!panel){const aside=document.querySelector('aside');if(aside){panel=document.createElement('div');panel.id='v119CyclePanel';panel.className='panel';panel.innerHTML='<h3>Déplacement</h3><button id="v119BikeBtn" style="width:100%"></button><div class="small" style="margin-top:7px">Bicyclette : après 4 Sceaux, uniquement sur les pistes cyclables.</div>';aside.prepend(panel);btn=panel.querySelector('#v119BikeBtn')}}
            if(!btn)return;const unlocked=bikeUnlockedV119(),track=onCycleTrackV119();btn.disabled=false;btn.textContent=!unlocked?'🔒 Bicyclette — 4 Sceaux':state.bike?'🚲 Descendre du vélo':track?'🚲 Monter à bicyclette':'🚲 Cherche une piste cyclable';btn.onclick=toggleBikeV119
          }
          function toggleBikeV119(){
            if(!ensureBikeUnlockV119()){state.bike=false;bikeNoticeV119('La bicyclette sera débloquée après le 4e Sceau.');refreshBikeUiV119();return false}
            if(state.bike){state.bike=false;bikeNoticeV119('Tu descends de la bicyclette.');refreshBikeUiV119();return true}
            if(!onCycleTrackV119()){bikeNoticeV119('La bicyclette ne peut être utilisée que sur une piste cyclable.');refreshBikeUiV119();return false}
            state.bike=true;bikeNoticeV119('Bicyclette en route !');refreshBikeUiV119();return true
          }
          function cycleMoveV119(dx,dy,dir){
            ensureBikeUnlockV119();
            if(typeof scene!=='undefined'&&scene==='world'&&state.bike&&!onCycleTrackV119()){state.bike=false;bikeNoticeV119('Tu dois être sur une piste cyclable pour utiliser la bicyclette.')}
            const result=typeof BASE.move==='function'?BASE.move.apply(this,arguments):false;
            if(typeof scene!=='undefined'&&scene==='world'&&state.bike&&!onCycleTrackV119()){state.bike=false;bikeNoticeV119('Tu quittes la piste cyclable : bicyclette rangée.')}
            refreshBikeUiV119();return result
          }
          window.ValdoraCycleV119={version:'V119-CYCLE',unlocked:bikeUnlockedV119,onTrack:onCycleTrackV119,toggle:toggleBikeV119,segments:cycleSegmentsV119,refresh:refreshBikeUiV119};
          '''
              living=living[:insert_at]+cycle_code+'\n'+living[insert_at:]

          draw_replacement=r'''function drawWorldV118(){
            const result=typeof BASE.drawWorld==='function'?BASE.drawWorld.apply(this,arguments):undefined;
            if(typeof scene!=='undefined'&&scene==='world'){
              try{drawCycleTracksV119()}catch(e){console.warn('V119 pistes cyclables',e)}
              try{if(window.ValdoraChestV118Bridge){window.ValdoraChestV118Bridge.ownedByV118=true;window.ValdoraChestV118Bridge.drawNow?.()}}catch(e){console.warn('V118 coffre Valdora',e)}
              if(current()?.kind==='town'){
                try{if(window.ValdoraBusV118Bridge){window.ValdoraBusV118Bridge.ownedByV118=true;window.ValdoraBusV118Bridge.drawNow?.()}}catch(e){console.warn('V118 arrêt Fluo Valdora',e)}
                drawTownAmbience()
              }
              refreshBikeUiV119()
            }
            return result
          }'''
          living=replace_function(living,'function drawWorldV118()',draw_replacement)

          old_move="window.move=BASE.move;try{move=BASE.move}catch(_){}"
          new_move="window.move=cycleMoveV119;try{move=cycleMoveV119}catch(_){}"
          if old_move not in living: raise SystemExit('V118 move hook not found')
          living=living.replace(old_move,new_move,1)

          # Make the cycle API visible in the V118 audit/export surface without
          # changing save compatibility.
          old_api_anchor='repairAllBuildings};'
          if old_api_anchor in living and 'cycle:window.ValdoraCycleV119' not in living:
              living=living.replace(old_api_anchor,'repairAllBuildings,cycle:window.ValdoraCycleV119};',1)

          index_path.write_text(index,encoding='utf-8')
          interior_path.write_text(interior,encoding='utf-8')
          living_path.write_text(living,encoding='utf-8')

      - name: Verify interaction and cycle repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function facingVector" game/V109V_INTERIEUR_REWRITE.js
          grep -q "interactionTarget:nearestInteractionTarget" game/V109V_INTERIEUR_REWRITE.js
          grep -q "q.target?.v118Resident" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "CYCLE_TOWNS_V119" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "window.move=cycleMoveV119" game/VALDORA_LIVING_WORLD_V118.js
          grep -q "v119BikeUnlocked=true" game/index.html
          if grep -q "if(state.seals.length>=4)state.bike=true;" game/index.html; then exit 1; fi
          node --check game/V109V_INTERIEUR_REWRITE.js
          node --check game/VALDORA_LIVING_WORLD_V118.js
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add game/index.html game/V109V_INTERIEUR_REWRITE.js game/VALDORA_LIVING_WORLD_V118.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "feat: precise interactions and cycle tracks"
          git push origin HEAD:main
