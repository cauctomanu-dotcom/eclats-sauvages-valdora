name: Apply V118 NPC and chest fix

on:
  push:
    paths:
      - '.github/workflows/apply-v118-npc-chest-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V118 living world
        shell: python
        run: |
          from pathlib import Path

          path = Path('game/VALDORA_LIVING_WORLD_V118.js')
          src = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "if(sc._v118PopulationReady&&!force){let stable=people.every(n=>!movable(n)||n._v118Placed);for(let i=0;stable&&i<people.length;i++)for(let j=i+1;j<people.length;j++)if(distance(people[i],people[j])<46){stable=false;break}if(stable)return}",
                  "if(sc._v118PopulationReady&&!force){const stable=people.every(n=>!movable(n)||n._v118Placed);if(stable)return}"
              ),
              (
                  "function relocateOverlap(n,nodes,all){const sc=current(),slots=roadSpawnSlots(sc,nodes),start=hash(n.id+'relocate')%Math.max(1,slots.length);for(let i=0;i<slots.length;i++){const q=slots[(start+i)%slots.length];if(all.every(o=>o===n||distance(q,o)>=54)){n.x=q.x;n.y=q.y;n._v118Node=q.nodeKey||nearestNode(nodes,q.x,q.y)?.key;n._v118Target=null;n.moving=false;return true}}return false}",
                  "function relocateOverlap(n,nodes,all){const sc=current();if(!sc||!n)return false;let vx=0,vy=0,nearest=Infinity;for(const o of all){if(o===n)continue;const dx=n.x-o.x,dy=n.y-o.y,d=Math.hypot(dx,dy);if(d>=43)continue;nearest=Math.min(nearest,d);if(d<.01){const a=(hash(`${n.id}|${o.id||o.name}`)%628)/100;vx+=Math.cos(a);vy+=Math.sin(a)}else{vx+=dx/d;vy+=dy/d}}const len=Math.hypot(vx,vy);if(!len||!Number.isFinite(nearest))return false;const step=Math.min(2.4,Math.max(.8,(43-nearest)*.16)),nx=n.x+vx/len*step,ny=n.y+vy/len*step;const free=nx>=26&&ny>=26&&nx<=(sc.width||1800)-26&&ny<=(sc.height||1100)-26&&!(sc.buildings||[]).some(b=>nx>b.x-24&&nx<b.x+b.w+24&&ny>b.y-20&&ny<b.y+b.h+30)&&!(sc.v105dTrees||[]).some(t=>Math.hypot(nx-t.x,ny-t.y)<43*(t.s||1));if(!free){n.moving=false;n._v118FreeTarget=null;n._v118Wait=performance.now()+160;return false}n.dir=Math.abs(vx)>Math.abs(vy)?(vx<0?1:2):(vy>0?0:3);n.x=nx;n.y=ny;n.moving=true;n._v118FreeTarget=null;n._v118Wait=performance.now()+18;return true}"
              ),
              (
                  "if(moved)scheduleTownPopulation(true,80);",
                  "if(moved)scheduleTownPopulation(false,80);"
              ),
          ]

          changed = False
          for old, new in replacements:
              if old not in src:
                  raise SystemExit(f'Expected V118 pattern not found: {old[:120]}')
              src = src.replace(old, new, 1)
              changed = True

          marker = "worldInteractV118.__v107dInteract=true;worldInteractV118.__v118StableInteract=true;"
          if marker not in src:
              anchor = "function worldInteractV118()"
              start = src.find(anchor)
              if start < 0:
                  raise SystemExit('worldInteractV118 not found')
              next_fn = src.find('\nfunction ', start + len(anchor))
              if next_fn < 0:
                  raise SystemExit('Could not locate end of worldInteractV118')
              src = src[:next_fn] + '\n' + marker + src[next_fn:]
              changed = True

          if changed:
              path.write_text(src, encoding='utf-8')

      - name: Verify targeted fixes
        shell: python
        run: |
          from pathlib import Path
          src = Path('game/VALDORA_LIVING_WORLD_V118.js').read_text(encoding='utf-8')
          checks = {
              'stable interaction marker': 'worldInteractV118.__v107dInteract=true;worldInteractV118.__v118StableInteract=true;',
              'no global forced respawn after repair': 'if(moved)scheduleTownPopulation(false,80);',
              'gradual overlap separation': 'const step=Math.min(2.4,Math.max(.8,(43-nearest)*.16))',
          }
          missing = [name for name, needle in checks.items() if needle not in src]
          if missing:
              raise SystemExit('Missing checks: ' + ', '.join(missing))
          if "n.x=q.x;n.y=q.y;n._v118Node=q.nodeKey" in src:
              raise SystemExit('Old PNJ teleport relocation still present')
          print('V118 targeted fixes verified')

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/VALDORA_LIVING_WORLD_V118.js
          git commit -m "fix: restore chests and smooth NPC movement"
          git push origin HEAD:main
