name: Temporary creator and interaction diagnostics
on:
  push:
    paths:
      - '.github/workflows/extract-creator-interactions-v122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract creator and interaction code
        run: python tools/extract_creator_interactions_v122.py
      - name: Commit diagnostic report
        run: |
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add _AI_V122_creator_interactions.txt
          git commit -m "chore: add creator interaction report" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
