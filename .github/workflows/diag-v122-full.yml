name: Temporary V122 full regression audit
on:
  push:
    paths:
      - '.github/workflows/diag-v122-full.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python tools/diag_v122_full.py
      - name: Commit audit report
        run: |
          git config user.name "cauctomanu-dotcom"
          git config user.email "cauctomanu@gmail.com"
          git add _AI_DIAG_V122.txt
          git commit -m "chore: add V122 regression audit report" || exit 0
          git push origin HEAD:main
